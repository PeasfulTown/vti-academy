spring.application.name=department

server.port = 8080
spring.datasource.url = jdbc:mysql://localhost:3306/TestingSystem?createDatabaseIfNotExists=true
spring.datasource.username = root
spring.datasource.password = root

#server.port = ${SERVER_PORT}
#spring.datasource.url = ${CUSTOM_DATASOURCE_URL}
#spring.datasource.username = ${CUSTOM_DATASOURCE_USERNAME}
#spring.datasource.password = ${CUSTOM_DATASOURCE_PASSWORD}

spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.format_sql = true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder = TRACE

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
