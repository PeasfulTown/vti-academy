services:
  db_mysql:
    image: mysql:8.0.44-debian
    container_name: db_hrm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: TestingSystem
      MYSQL_USER: vtiuser
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - vti_mysql_data:/var/lib/mysql
      - ./mysql/DB_TestingSystem.sql:/docker-entrypoint-initdb.d/DB_TestingSystem_init.sql:ro

  app_springboot:
    image: eclipse-temurin:17-jdk
    container_name: app_hrm_springboot
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db_mysql:3306/TestingSystem?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: vtiuser
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - db_mysql
    volumes:
      - ./hrm:/app
    working_dir: /app
    command: java -jar Account_Management_DEMO-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:8080"

volumes:
  vti_mysql_data:

