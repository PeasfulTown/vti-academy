# THE HRM SPRING BOOT APPLICATION MUST BE COMPILED WITH THESE PROPERTIES
# DECLARED AS FOLLOWS (e.g `env:SPRING_DATASOURCE_URL`, etc.) SO THAT THE
# APPLICATION CAN READ THE SYSTEM'S (IN THIS CASE THE DOCKER CONTAINER'S)
# ENVIRONMENT VARIABLES

# -----------------------
# Database
# -----------------------
spring.datasource.url=env:SPRING_DATASOURCE_URL
spring.datasource.username=env:SPRING_DATASOURCE_USERNAME
spring.datasource.password=env:SPRING_DATASOURCE_PASSWORD

# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------
# Show sql
# -----------------------
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


