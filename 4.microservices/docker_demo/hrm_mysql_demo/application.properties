# -----------------------
# Database
# -----------------------

# dotenv file
spring.datasource.url=${CUSTOM_DATASOURCE_URL}
spring.datasource.username=${CUSTOM_DATASOURCE_USERNAME}
spring.datasource.password=${CUSTOM_DATASOURCE_PASSWORD}

# system environment variables
#spring.datasource.url=env:CUSTOM_DATASOURCE_URL
#spring.datasource.username=env:CUSTOM_DATASOURCE_USERNAME
#spring.datasource.password=env:CUSTOM_DATASOURCE_PASSWORD

# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------
# Show sql
# -----------------------
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


